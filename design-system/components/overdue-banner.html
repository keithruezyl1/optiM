<!-- @dsCard group="Components" name="Overdue banner" subtitle="Persistent contract alert" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{--slate-100:#F3F5F8;--ink:#1A2433;--signal-red:#C0392B;--border:#E3E8EF;--banner-red:#FBEAE8;
  --font-sans:'IBM Plex Sans',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--ink);background:var(--slate-100);padding:28px}
.banner{display:flex;align-items:center;gap:12px;max-width:820px;border:1px solid var(--border);
  border-left:3px solid var(--signal-red);background:var(--banner-red);border-radius:8px;padding:14px 16px;
  box-shadow:0 1px 2px rgba(11,31,58,.06)}
.banner p{font-size:14px}
.strong{color:var(--signal-red);font-weight:600}
svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--signal-red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
  <div class="banner" role="alert">
    <svg viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <p><span class="strong">2 deliverables overdue</span> across 1 contract — action needed.</p>
  </div>
</body>
</html>
